name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-blog:
    runs-on: ubuntu-latest
    env:
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SERVER_IP: 52.69.164.172
      SSH_USER: ubuntu
      REMOTE_ROOT: /var/www/araya.dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Must run before setup-node: `cache: pnpm` invokes `pnpm store path`.
      # The pnpm version comes from the packageManager field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js env
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            blog.araya.dev/pnpm-lock.yaml
      - name: Build blog
        working-directory: ./blog.araya.dev
        run: |
          pnpm install --frozen-lockfile
          pnpm build:prod
      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${SERVER_IP} >> ~/.ssh/known_hosts
          echo -e "$SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
      - name: Deploy all
        run: |
          rsync --exclude "**/node_modules" --delete -r -e "ssh -i ~/.ssh/key" ./ ${SSH_USER}@${SERVER_IP}:${REMOTE_ROOT}/

  deploy-editor:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # Without the token there is nothing to deploy to, and a red main branch
      # would be a worse signal than a skipped job.
      - name: Check for Cloudflare credentials
        id: guard
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; skipping the editor deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.guard.outputs.configured == 'true'
      - name: Setup pnpm
        if: steps.guard.outputs.configured == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js env
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            editor.araya.dev/pnpm-lock.yaml
      - name: Check and test
        if: steps.guard.outputs.configured == 'true'
        working-directory: ./editor.araya.dev
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
      # `pnpm deploy` builds the client bundle into ./public first; wrangler
      # reads CLOUDFLARE_API_TOKEN from the environment.
      - name: Deploy editor
        if: steps.guard.outputs.configured == 'true'
        working-directory: ./editor.araya.dev
        run: pnpm run deploy
